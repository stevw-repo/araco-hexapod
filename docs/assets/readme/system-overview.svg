<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Araco software path</title>
<desc id="desc">The high-level path from operator input to a replaceable robot backend and physical feedback.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172233"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3977d4"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc6b32"/></marker>
</defs>
<rect width="1200" height="405" fill="#ffffff"/>
<text x="44" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#172233" text-anchor="start">From motion intent to 25 controlled joints</text>
<text x="44" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="start">The locomotion mathematics is independent of whether the backend is Gazebo or future hardware.</text>
<rect x="44" y="125" width="190" height="88" rx="14" fill="#ffffff" stroke="#3977d4" stroke-width="2"/>
<rect x="44" y="125" width="8" height="88" rx="4" fill="#3977d4"/>
<text x="68" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Operator input</text>
<text x="68" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">joystick or keyboard</text>
<rect x="274" y="125" width="190" height="88" rx="14" fill="#ffffff" stroke="#168c7a" stroke-width="2"/>
<rect x="274" y="125" width="8" height="88" rx="4" fill="#168c7a"/>
<text x="298" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Motion intent</text>
<text x="298" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">velocity + body pose</text>
<rect x="504" y="125" width="190" height="88" rx="14" fill="#ffffff" stroke="#7457c8" stroke-width="2"/>
<rect x="504" y="125" width="8" height="88" rx="4" fill="#7457c8"/>
<text x="528" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Command boundary</text>
<text x="528" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">selection + validation</text>
<rect x="734" y="125" width="190" height="88" rx="14" fill="#ffffff" stroke="#dc6b32" stroke-width="2"/>
<rect x="734" y="125" width="8" height="88" rx="4" fill="#dc6b32"/>
<text x="758" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Locomotion</text>
<text x="758" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">body · gait · IK</text>
<rect x="964" y="125" width="190" height="88" rx="14" fill="#ffffff" stroke="#c94d58" stroke-width="2"/>
<rect x="964" y="125" width="8" height="88" rx="4" fill="#c94d58"/>
<text x="988" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">ros2_control</text>
<text x="988" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">24 leg + 1 gimbal</text>
<line x1="242" y1="169" x2="269" y2="169" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="472" y1="169" x2="499" y2="169" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="702" y1="169" x2="729" y2="169" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="932" y1="169" x2="959" y2="169" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="680" y="277" width="476" height="78" rx="12" fill="#f5f7fb" stroke="#d9e0ea" stroke-width="1.5"/>
<text x="704" y="309" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172233" text-anchor="start">Replaceable backend</text>
<text x="704" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">Gazebo Harmonic today · Raspberry Pi servo interface later</text>
<line x1="1059" y1="215" x2="1059" y2="271" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="694" y1="316" x2="278" y2="316" stroke="#3977d4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="486" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#3977d4" text-anchor="middle">joint state / observations</text>
</svg>
