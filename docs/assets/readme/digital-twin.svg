<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Araco digital model pipeline</title>
<desc id="desc">The flow from Fusion geometry and measured component research into the canonical ROS model and Gazebo simulation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172233"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3977d4"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc6b32"/></marker>
</defs>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="44" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#172233" text-anchor="start">One canonical model, several representations</text>
<text x="44" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="start">Presentation meshes, collision shapes, kinematics, and provisional dynamics are kept separate on purpose.</text>
<rect x="44" y="130" width="190" height="88" rx="14" fill="#ffffff" stroke="#3977d4" stroke-width="2"/>
<rect x="44" y="130" width="8" height="88" rx="4" fill="#3977d4"/>
<text x="68" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Fusion 360</text>
<text x="68" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">assembly + joints</text>
<rect x="270" y="130" width="190" height="88" rx="14" fill="#ffffff" stroke="#168c7a" stroke-width="2"/>
<rect x="270" y="130" width="8" height="88" rx="4" fill="#168c7a"/>
<text x="294" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Export evidence</text>
<text x="294" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">meshes + properties</text>
<rect x="496" y="130" width="190" height="88" rx="14" fill="#ffffff" stroke="#7457c8" stroke-width="2"/>
<rect x="496" y="130" width="8" height="88" rx="4" fill="#7457c8"/>
<text x="520" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Canonical model</text>
<text x="520" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">26 links · 25 joints</text>
<rect x="722" y="130" width="190" height="88" rx="14" fill="#ffffff" stroke="#dc6b32" stroke-width="2"/>
<rect x="722" y="130" width="8" height="88" rx="4" fill="#dc6b32"/>
<text x="746" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Xacro / URDF</text>
<text x="746" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">ROS frames + control</text>
<rect x="948" y="130" width="190" height="88" rx="14" fill="#ffffff" stroke="#c94d58" stroke-width="2"/>
<rect x="948" y="130" width="8" height="88" rx="4" fill="#c94d58"/>
<text x="972" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Gazebo</text>
<text x="972" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">physics + sensors</text>
<line x1="242" y1="174" x2="269" y2="174" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="468" y1="174" x2="495" y2="174" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="694" y1="174" x2="721" y2="174" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="920" y1="174" x2="947" y2="174" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="295" width="238" height="86" rx="12" fill="#f5f7fb" stroke="#3977d4" stroke-width="1.8"/>
<text x="98" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#3977d4" text-anchor="start">visual</text>
<text x="98" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">49 exact mesh visuals</text>
<line x1="199" y1="290" x2="591" y2="222" stroke="#d9e0ea" stroke-width="1.5" stroke-linecap="round"/>
<rect x="356" y="295" width="238" height="86" rx="12" fill="#f5f7fb" stroke="#168c7a" stroke-width="1.8"/>
<text x="374" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#168c7a" text-anchor="start">collision</text>
<text x="374" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">simple stable primitives</text>
<line x1="475" y1="290" x2="591" y2="222" stroke="#d9e0ea" stroke-width="1.5" stroke-linecap="round"/>
<rect x="632" y="295" width="238" height="86" rx="12" fill="#f5f7fb" stroke="#7457c8" stroke-width="1.8"/>
<text x="650" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#7457c8" text-anchor="start">kinematics</text>
<text x="650" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">43 / 120 / 120 / 50 mm</text>
<line x1="751" y1="290" x2="591" y2="222" stroke="#d9e0ea" stroke-width="1.5" stroke-linecap="round"/>
<rect x="908" y="295" width="238" height="86" rx="12" fill="#f5f7fb" stroke="#dc6b32" stroke-width="1.8"/>
<text x="926" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#dc6b32" text-anchor="start">dynamics</text>
<text x="926" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">rough_estimate_v0</text>
<line x1="1027" y1="290" x2="591" y2="222" stroke="#d9e0ea" stroke-width="1.5" stroke-linecap="round"/>
<text x="600" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="middle">Separation prevents a pretty mesh or a bad CAD material assignment from silently becoming physics truth.</text>
</svg>
