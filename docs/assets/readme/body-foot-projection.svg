<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Planted-foot body transform and foot projection</title>
<desc id="desc">A moved body expressed relative to fixed world feet, with world-down projected into each leg plane.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172233"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3977d4"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc6b32"/></marker>
</defs>
<rect width="1200" height="610" fill="#ffffff"/>
<text x="44" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#172233" text-anchor="start">Move the body while the feet remain planted</text>
<text x="44" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="start">The desired world-vertical foot direction is projected into each leg’s realizable sagittal plane.</text>
<line x1="88" y1="517" x2="356" y2="517" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="88" y1="517" x2="88" y2="212" stroke="#172233" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="362" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">world x</text>
<text x="70" y="197" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#172233" text-anchor="middle">world z</text>
<g transform="translate(310 315) rotate(-12)"><rect x="-122" y="-48" width="244" height="96" rx="28" fill="#f5f7fb" stroke="#3977d4" stroke-width="3"/><line x1="0" y1="0" x2="120" y2="0" stroke="#3977d4" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="0" y="-67" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172233">moved base_link</text></g>
<circle cx="560" cy="517" r="10" fill="#dc6b32" stroke="#dc6b32" stroke-width="2"/>
<text x="560" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="middle">fixed foot Pᵂ</text>
<line x1="372" y1="337" x2="560" y2="517" stroke="#168c7a" stroke-width="6" stroke-linecap="round"/>
<text x="474" y="413" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#168c7a" text-anchor="middle">target expressed in moved body</text>
<rect x="655" y="117" width="501" height="438" rx="14" fill="#ffffff" stroke="#d9e0ea" stroke-width="1.5"/>
<text x="682" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172233" text-anchor="start">Coordinate transform</text>
<text x="682" y="194" font-family="Cambria Math,STIX Two Math,serif" font-size="24" font-weight="400" fill="#172233" text-anchor="start">Pᴮ = Rᵀ (Pᵂ − t)</text>
<text x="682" y="225" font-family="Cambria Math,STIX Two Math,serif" font-size="16" font-weight="400" fill="#5b6678" text-anchor="start">R = Rz(yaw) Ry(pitch) Rx(roll)</text>
<line x1="750" y1="480" x2="750" y2="290" stroke="#dc6b32" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="768" y="308" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#dc6b32" text-anchor="start">world-down in body</text>
<path d="M 725 490 L 994 390 L 1035 504 Z" fill="#f5f7fb" stroke="#d9e0ea" stroke-width="2"/>
<text x="965" y="376" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="middle">leg sagittal plane</text>
<line x1="750" y1="480" x2="961" y2="402" stroke="#3977d4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="883" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#3977d4" text-anchor="middle">realizable projection</text>
<line x1="750" y1="480" x2="820" y2="454" stroke="#c94d58" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="842" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#c94d58" text-anchor="start">residual δ</text>
<text x="682" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#172233" text-anchor="start">A four-DOF leg controls pitch in one plane.</text>
<text x="682" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6678" text-anchor="start">δ reports the lateral component the chain cannot realize.</text>
</svg>
