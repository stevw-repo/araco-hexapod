<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Four degree of freedom leg kinematics</title>
<desc id="desc">Top and sagittal views of the analytic four-joint leg geometry and wrist-point reduction.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172233"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3977d4"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc6b32"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="44" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#172233" text-anchor="start">Reducing four joints to a solvable two-link triangle</text>
<text x="44" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="start">q₁ chooses the leg plane; q₂ and q₃ reach the wrist; q₄ closes the requested foot pitch ψ.</text>
<rect x="44" y="112" width="330" height="252" rx="14" fill="#f5f7fb" stroke="#d9e0ea" stroke-width="1.5"/>
<text x="68" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">1 · Choose the sagittal plane</text>
<line x1="125" y1="275" x2="325" y2="275" stroke="#d9e0ea" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="125" y1="275" x2="285" y2="190" stroke="#3977d4" stroke-width="6" stroke-linecap="round"/>
<circle cx="125" cy="275" r="9" fill="#ffffff" stroke="#172233" stroke-width="2"/>
<circle cx="285" cy="190" r="7" fill="#3977d4" stroke="#3977d4" stroke-width="2"/>
<path d="M 183 275 A 58 58 0 0 0 176 248" fill="none" stroke="#dc6b32" stroke-width="3"/>
<text x="180" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#dc6b32" text-anchor="start">q₁ = atan2(y, x)</text>
<text x="294" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">P(x,y,z)</text>
<text x="68" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#172233" text-anchor="start">r = √(x² + y²)</text>
<rect x="404" y="112" width="752" height="560" rx="14" fill="#ffffff" stroke="#d9e0ea" stroke-width="1.5"/>
<text x="430" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">2 · Solve inside that plane</text>
<line x1="450" y1="540" x2="1068" y2="540" stroke="#d9e0ea" stroke-width="2" stroke-linecap="round"/>
<line x1="478" y1="400" x2="570" y2="400" stroke="#7457c8" stroke-width="8" stroke-linecap="round"/>
<line x1="570" y1="400" x2="738" y2="242" stroke="#3977d4" stroke-width="8" stroke-linecap="round"/>
<line x1="738" y1="242" x2="920" y2="407" stroke="#168c7a" stroke-width="8" stroke-linecap="round"/>
<line x1="920" y1="407" x2="920" y2="540" stroke="#dc6b32" stroke-width="8" stroke-linecap="round"/>
<circle cx="478" cy="400" r="10" fill="#ffffff" stroke="#172233" stroke-width="3"/>
<text x="492" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">O</text>
<circle cx="570" cy="400" r="10" fill="#ffffff" stroke="#172233" stroke-width="3"/>
<text x="584" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">A</text>
<circle cx="738" cy="242" r="10" fill="#ffffff" stroke="#172233" stroke-width="3"/>
<text x="752" y="229" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">K</text>
<circle cx="920" cy="407" r="10" fill="#ffffff" stroke="#172233" stroke-width="3"/>
<text x="934" y="394" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">W</text>
<circle cx="920" cy="540" r="10" fill="#ffffff" stroke="#172233" stroke-width="3"/>
<text x="934" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172233" text-anchor="start">P</text>
<text x="512" y="386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#7457c8" text-anchor="middle">L₁ = 43 mm</text>
<text x="650" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#3977d4" text-anchor="middle">L₂ = 120 mm</text>
<text x="832" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#168c7a" text-anchor="middle">L₃ = 120 mm</text>
<text x="939" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#dc6b32" text-anchor="start">L₄ = 50 mm</text>
<line x1="570" y1="400" x2="920" y2="407" stroke="#c94d58" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="748" y="431" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#c94d58" text-anchor="middle">wrist vector (s, zᵥ)</text>
<line x1="920" y1="540" x2="1036" y2="540" stroke="#d9e0ea" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 920 485 A 55 55 0 0 1 975 540" fill="none" stroke="#dc6b32" stroke-width="3"/>
<text x="982" y="506" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#dc6b32" text-anchor="start">ψ</text>
<rect x="44" y="405" width="330" height="267" rx="14" fill="#ffffff" stroke="#d9e0ea" stroke-width="1.5"/>
<text x="68" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172233" text-anchor="start">Wrist-point reduction</text>
<text x="68" y="472" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">r = √(x² + y²)</text>
<text x="68" y="501" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">s = r − L₁ − L₄ cos ψ</text>
<text x="68" y="530" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">zᵥ = z − L₄ sin ψ</text>
<text x="68" y="559" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">c₃ = (s² + zᵥ² − L₂² − L₃²) / (2L₂L₃)</text>
<text x="68" y="588" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">q₃ = −acos(c₃)   (knee-down)</text>
<text x="68" y="617" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">q₂ = atan2(zᵥ,s) − atan2(L₃ sin q₃,L₂+L₃ cos q₃)</text>
<text x="68" y="646" font-family="Cambria Math,STIX Two Math,serif" font-size="14" font-weight="400" fill="#172233" text-anchor="start">q₄ = ψ − q₂ − q₃</text>
<text x="600" y="711" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6678" text-anchor="middle">The solver then checks reachability, singularity, joint limits, and FK reconstruction error.</text>
</svg>
